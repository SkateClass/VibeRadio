carousel.tabIndex=0;carousel.addEventListener('pointerdown',e=>{if(view!=='horizontal'||e.button!==0||swipeState||!cards().length)return;swipeState={id:e.pointerId,x:e.clientX,y:e.clientY,time:performance.now(),index:swipeIndex,left:carousel.scrollLeft,drag:false};},{passive:true});carousel.addEventListener('pointermove',e=>{const s=swipeState;if(!s||s.id!==e.pointerId)return;const dx=e.clientX-s.x,dy=e.clientY-s.y;if(!s.drag&&Math.abs(dy)>12&&Math.abs(dy)>Math.abs(dx)){swipeState=null;return;}if(!s.drag&&Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.15){s.drag=true;try{carousel.setPointerCapture(e.pointerId)}catch{}}if(s.drag){e.preventDefault();const a=cards(),step=a[1]?a[1].offsetLeft-a[0].offsetLeft:carousel.clientWidth;carousel.scrollLeft=s.left-Math.max(-step,Math.min(step,dx));}},{passive:false});
function endSwipe(e,cancel=false){const s=swipeState;if(!s||s.id!==e.pointerId)return;swipeState=null;let i=s.index;if(s.drag){swipeSuppressUntil=performance.now()+450;const dx=e.clientX-s.x,dy=e.clientY-s.y,dt=Math.max(1,performance.now()-s.time);if(!cancel&&Math.abs(dx)>Math.abs(dy)&&(Math.abs(dx)>42||Math.abs(dx)>18&&Math.abs(dx)/dt>.35))i+=dx<0?1:-1;buzz();}if(swipePending){swipePending=false;render();}if(s.drag)goCard(i);}
carousel.addEventListener('pointerup',e=>endSwipe(e));carousel.addEventListener('pointercancel',e=>endSwipe(e,true));window.addEventListener('pointerup',e=>{if(swipeState?.id===e.pointerId)endSwipe(e)});carousel.addEventListener('click',e=>{if(performance.now()<swipeSuppressUntil){e.preventDefault();e.stopImmediatePropagation()}},{capture:true});carousel.addEventListener('wheel',e=>{if(view!=='horizontal')return;const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;if(Math.abs(d)<3)return;e.preventDefault();if(performance.now()<wheelLock)return;wheelLock=performance.now()+550;goCard(swipeIndex+(d>0?1:-1));buzz()},{passive:false});carousel.addEventListener('keydown',e=>{if(view==='horizontal'&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();goCard(swipeIndex+(e.key==='ArrowRight'?1:-1));buzz()}});
function measureLayers(){document.documentElement.style.setProperty('--dockH',Math.round($('player').getBoundingClientRect().height)+'px');document.documentElement.style.setProperty('--chromeH',Math.round(document.querySelector('.chrome').getBoundingClientRect().height)+'px');}if('ResizeObserver'in window){const obs=new ResizeObserver(measureLayers);obs.observe($('player'));obs.observe(document.querySelector('.chrome'));}requestAnimationFrame(measureLayers);window.addEventListener('resize',()=>{measureLayers();if(view==='horizontal'&&!swipeState)requestAnimationFrame(()=>goCard(swipeIndex,false))},{passive:true});
